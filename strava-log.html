<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strava Log — Laura on Trail</title>
  <meta property="og:title" content="Laura on Trail — AT Thru-Hike 2026">
  <meta property="og:description" content="Hiking 2,198 miles from Georgia to Maine. Follow along.">
  <meta property="og:image" content="https://lauratheexplorer.co/preview.jpg">
  <meta property="og:url" content="https://lauratheexplorer.co">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://lauratheexplorer.co/preview.jpg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css" />
  <style>
    .strava-hero {
      text-align: center;
      background: var(--cream);
      border-bottom: 2px solid var(--ink);
      padding: 2.5rem 2rem 2rem;
    }
    .strava-hero h1 { border-bottom: none; padding-bottom: 0; }

    /* Activity card */
    .activity-card {
      background: var(--white);
      border: 1px solid var(--fog);
      border-top: 4px solid #c4621a;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    .activity-header {
      padding: 1.2rem 1.4rem 0.75rem;
      border-bottom: 1px solid var(--fog);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .activity-date {
      font-family: var(--sans);
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--pine);
      margin-bottom: 0.3rem;
      display: block;
    }
    .activity-title {
      font-family: var(--display);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }
    .strava-link {
      font-family: var(--sans);
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--teal);
      text-decoration: none;
      border-bottom: 1px solid var(--teal);
      white-space: nowrap;
      flex-shrink: 0;
      padding-top: 4px;
    }
    .strava-link:hover { color: var(--ink); border-bottom-color: var(--ink); }

    /* Stats row */
    .activity-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--fog);
    }
    .activity-stat {
      padding: 0.85rem 0.75rem;
      text-align: center;
      border-right: 1px solid var(--fog);
    }
    .activity-stat:last-child { border-right: none; }
    .activity-stat-val {
      font-family: var(--display);
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--ink);
      line-height: 1;
      display: block;
    }
    .activity-stat-lbl {
      font-family: var(--sans);
      font-size: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #c4621a;
      margin-top: 3px;
      display: block;
    }

    /* AT section badge — sits inside activity header */
    .activity-section-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.55rem;
      font-family: var(--sans);
      font-size: 0.55rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--pine);
    }
    .section-badge-dot {
      width: 6px;
      height: 6px;
      background: var(--pine);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Elevation chart */
    .activity-elevation {
      background: var(--cream);
      border-top: 1px solid var(--fog);
      overflow: hidden;
      line-height: 0;
      padding: 0.5rem 1.25rem;
    }
    .activity-elevation svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Caption */
    .activity-caption {
      padding: 1.2rem 1.4rem;
      font-family: var(--body);
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--earth);
      border-top: 1px solid var(--fog);
    }
    .activity-caption p { margin-bottom: 0.75rem; }
    .activity-caption p:last-child { margin-bottom: 0; }
    .no-caption {
      font-style: italic;
      color: var(--trail);
    }

    /* Photos */
    .activity-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      border-top: 1px solid var(--fog);
    }
    .activity-photos img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    /* Lightbox — per-activity photo viewer. Desktop navigates with the arrow
       buttons/keyboard; touch devices (phone, iPad) swipe instead, so the
       buttons hide under (hover: none) rather than a width breakpoint. */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(26,18,8,0.95);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      position: relative;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: pan-y;
    }
    .lightbox-inner img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 3px;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }
    .lightbox-counter {
      margin-top: 0.75rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--trail);
    }
    .lightbox-close {
      position: absolute;
      top: -2.5rem;
      right: 0;
      background: none;
      border: none;
      color: var(--fog);
      font-size: 1.5rem;
      cursor: pointer;
      font-family: var(--mono);
      line-height: 1;
      padding: 4px 8px;
      transition: color 0.15s;
    }
    .lightbox-close:hover { color: var(--white); }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(26,18,8,0.15);
      border: none;
      color: var(--fog);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.75rem 1rem;
      border-radius: 2px;
      transition: background 0.15s;
      font-family: var(--mono);
    }
    .lightbox-nav:hover { background: rgba(26,18,8,0.25); }
    .lightbox-nav.prev { left: -4rem; }
    .lightbox-nav.next { right: -4rem; }

    @media (hover: none) {
      .lightbox-nav { display: none; }
    }
    @media (max-width: 960px) {
      .lightbox-nav.prev { left: 0.5rem; }
      .lightbox-nav.next { right: 0.5rem; }
      .lightbox-close { top: 0.5rem; right: 0.5rem; }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--trail);
    }
    .empty-state p { font-style: italic; margin-top: 0.5rem; }

    /* Loading */
    .loading-state {
      text-align: center;
      padding: 4rem 2rem;
      font-family: var(--sans);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--trail);
    }

    /* Strava badge */
    .powered-by {
      text-align: center;
      padding: 1.5rem;
      font-family: var(--sans);
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--trail);
    }
    .powered-by a { color: var(--teal); text-decoration: none; border-bottom: 1px solid var(--teal); }

    @media (max-width: 600px) {
      .activity-stats { grid-template-columns: repeat(2, 1fr); }
      .activity-stats .activity-stat:nth-child(2) { border-right: none; }
      .activity-stats .activity-stat:nth-child(3) { border-top: 1px solid var(--fog); }
      .activity-stats .activity-stat:nth-child(4) { border-top: 1px solid var(--fog); }
      .activity-photos { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

<script src="comments.js"></script>
<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
// This page reads from data/strava-activities.json, which is written by
// the nightly strava-sync.js GitHub Action.
const DATA_URL = 'data/strava-activities.json';

// ── HELPERS ─────────────────────────────────────────────────────────────────
function metersToMiles(m) { return (m / 1609.34).toFixed(2); }
function metersToFeet(m)  { return Math.round(m * 3.28084).toLocaleString(); }

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function formatPace(seconds, meters) {
  if (!meters) return '—';
  const secsPerMile = seconds / (meters / 1609.34);
  const m = Math.floor(secsPerMile / 60);
  const s = Math.round(secsPerMile % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function formatDate(isoString) {
  const d = new Date(isoString);
  return d.toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

// ── AT SECTION LOOKUP ────────────────────────────────────────────────────────
// [maxMile, sectionName, state(s)] — maxMile is inclusive upper bound.
// Mile cutoffs aligned with TRAIL_WAYPOINTS / STATE_ENTRY_MILES in index.html.
const AT_SECTIONS = [
  [31,   'Springer Mountain to Neels Gap',          'Georgia'],
  [78,   'Northern Georgia',                        'Georgia'],
  [137,  'Nantahala National Forest',               'North Carolina'],
  [165,  'Approaching the Smokies',                 'North Carolina'],
  [242,  'Great Smoky Mountains National Park',     'Tennessee / North Carolina'],
  [307,  'Hot Springs Region',                      'North Carolina'],
  [396,  'Roan Highlands',                          'Tennessee'],
  [453,  'Northeast Tennessee',                     'Tennessee'],
  [535,  'Damascus & Grayson Highlands',            'Virginia'],
  [705,  'Southwest Virginia',                      'Virginia'],
  [866,  'Central Virginia',                        'Virginia'],
  [972,  'Shenandoah National Park',                'Virginia'],
  [1018, 'Northern Virginia',                       'Virginia'],
  [1028, 'Harpers Ferry',                           'West Virginia'],
  [1065, 'Maryland',                                'Maryland'],
  [1150, 'Southern Pennsylvania',                   'Pennsylvania'],
  [1261, 'Pennsylvania — The Rocks',                'Pennsylvania'],
  [1305, 'Eastern Pennsylvania',                    'Pennsylvania'],
  [1370, 'New Jersey',                              'New Jersey'],
  [1458, 'New York',                                'New York'],
  [1520, 'Connecticut',                             'Connecticut'],
  [1600, 'Massachusetts',                           'Massachusetts'],
  [1741, 'Vermont — Long Trail Country',            'Vermont'],
  [1820, 'Southern New Hampshire',                  'New Hampshire'],
  [1900, 'White Mountains',                         'New Hampshire'],
  [2083, 'Southern Maine',                          'Maine'],
  [2183, '100-Mile Wilderness',                     'Maine'],
  [2198, 'Baxter State Park',                       'Maine'],
];
const AT_TOTAL = 2198;

// activity id → photo src array, so the lightbox only ever cycles through
// that one activity's photos, not the whole page.
const activityPhotoSets = {};

function getATSection(mile) {
  return AT_SECTIONS.find(([max]) => mile <= max) || AT_SECTIONS[AT_SECTIONS.length - 1];
}

function parseMile(description) {
  if (!description) return null;
  const m = description.match(/end\s*mile[:\s\-]+([\d.]+)/i);
  return m ? parseFloat(m[1]) : null;
}

// Returns a compact inline badge string (injected into the header, not a separate block)
function sectionBadgeHTML(activity) {
  const mile = activity.end_mile ?? parseMile(activity.description);
  if (mile === null) return '';
  const [, name, state] = getATSection(mile);
  return `<div class="activity-section-badge"><span class="section-badge-dot"></span>${name} &middot; ${state} &middot; Mile ${mile}</div>`;
}

// ── ELEVATION CHART ──────────────────────────────────────────────────────────
function renderElevationChart(activity) {
  const elev = activity.altitude_stream;
  if (!elev || elev.length < 2) return '';

  const W = 1000, H = 160;
  const PL = 85, PR = 12, PT = 14, PB = 18;
  const CW = W - PL - PR, CH = H - PT - PB;
  const n = elev.length;

  const minE = Math.min(...elev);
  const maxE = Math.max(...elev);
  const range = maxE - minE || 1;

  const pts = elev.map((v, i) => [
    PL + (i / (n - 1)) * CW,
    PT + (1 - (v - minE) / range) * CH,
  ]);

  // Light Catmull-Rom — removes GPS jitter, preserves real terrain shape
  const T = 0.15;
  let line = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(n - 1, i + 2)];
    const cp1x = (p1[0] + (p2[0] - p0[0]) * T).toFixed(1);
    const cp1y = (p1[1] + (p2[1] - p0[1]) * T).toFixed(1);
    const cp2x = (p2[0] - (p3[0] - p1[0]) * T).toFixed(1);
    const cp2y = (p2[1] - (p3[1] - p1[1]) * T).toFixed(1);
    line += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }

  const base = PT + CH;
  const fill = `${line} L ${pts[n-1][0].toFixed(1)},${base} L ${pts[0][0].toFixed(1)},${base} Z`;

  const toFt  = m => Math.round(m * 3.28084).toLocaleString();
  const gid   = `eg${activity.id}`;

  return `<div class="activity-elevation"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2c5530" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2c5530" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <line x1="${PL}" y1="${base}" x2="${W-PR}" y2="${base}" stroke="#c8c2b6" stroke-width="0.8"/>
  <line x1="${PL}" y1="${PT}"   x2="${PL}"   y2="${base}" stroke="#c8c2b6" stroke-width="0.8"/>
  <path d="${fill}" fill="url(#${gid})"/>
  <path d="${line}" fill="none" stroke="#2c5530" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="${PL-6}" y="${PT+4}"   text-anchor="end" font-family="monospace" font-size="12" fill="#8a806e">${toFt(maxE)} ft</text>
  <text x="${PL-6}" y="${base-2}" text-anchor="end" font-family="monospace" font-size="12" fill="#8a806e">${toFt(minE)} ft</text>
</svg></div>`;
}

// ── RENDER ACTIVITY ─────────────────────────────────────────────────────────
function renderActivity(activity) {
  const distMi  = metersToMiles(activity.distance);
  const elevFt  = metersToFeet(activity.total_elevation_gain);
  const timeStr = formatTime(activity.moving_time);
  const pace    = formatPace(activity.moving_time, activity.distance);
  const dateStr = formatDate(activity.start_date_local || activity.start_date);

  // Clean caption — strip "End mile: NNN" line
  const rawDesc = (activity.description || '').trim();
  const cleanDesc = rawDesc.replace(/end\s*mile[:\s\-]+[\d.]+/gi, '').trim();
  const paragraphs = cleanDesc
    ? cleanDesc.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g,' ').trim()}</p>`).join('')
    : `<p class="no-caption">No caption for this activity.</p>`;

  // Photos only — videos are excluded from the site
  const mediaItems = (activity.media
    || (activity.photos || []).map(src => ({ type: 'photo', src })))
    .filter(item => item.type !== 'video');

  activityPhotoSets[activity.id] = mediaItems.map(item => item.src);

  const photoHTML = mediaItems.length
    ? `<div class="activity-photos">${mediaItems.map((item, i) =>
        `<img src="${item.src}" alt="Trail photo" loading="lazy" onclick="openLightbox(${activity.id}, ${i})">`
      ).join('')}</div>`
    : '';

  const card = document.createElement('div');
  card.className = 'activity-card';
  card.innerHTML = `
    <div class="activity-header">
      <div>
        <span class="activity-date">${dateStr}</span>
        <div class="activity-title">${activity.name || 'Trail Day'}</div>
        ${sectionBadgeHTML(activity)}
        ${cleanDesc ? `<div class="activity-caption" style="border-top:none;padding:0.5rem 0 0">${paragraphs}</div>` : ''}
      </div>
    </div>

    <div class="activity-stats">
      <div class="activity-stat">
        <span class="activity-stat-val">${distMi}</span>
        <span class="activity-stat-lbl">Miles</span>
      </div>
      <div class="activity-stat">
        <span class="activity-stat-val">${timeStr}</span>
        <span class="activity-stat-lbl">Moving time</span>
      </div>
      <div class="activity-stat">
        <span class="activity-stat-val">${elevFt} ft</span>
        <span class="activity-stat-lbl">Elevation gain</span>
      </div>
      <div class="activity-stat">
        <span class="activity-stat-val">${pace}</span>
        <span class="activity-stat-lbl">Pace / mi</span>
      </div>
    </div>

    ${renderElevationChart(activity)}

    ${photoHTML}

    <div style="padding:1.5rem 1.4rem;border-top:1px solid var(--fog)">
      <span style="font-family:var(--sans);font-size:0.6rem;font-weight:600;text-transform:uppercase;letter-spacing:0.15em;color:#c4621a;display:block;margin-bottom:0.75rem">Comments</span>
      <div class="comments-widget" data-slug="activity-${activity.id}"></div>
    </div>
  `;

  return card;
}

// ── LIGHTBOX ─────────────────────────────────────────────────────────────────
// Desktop: arrow buttons + ←/→ keys. Touch (phone/iPad): swipe left/right.
// Both navigate within the tapped photo's own activityPhotoSets entry only.
let lightboxPhotos = [];
let lightboxIndex  = 0;

function openLightbox(activityId, index) {
  lightboxPhotos = activityPhotoSets[activityId] || [];
  if (!lightboxPhotos.length) return;
  lightboxIndex = index;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function closeLightboxOnBg(e) {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
}

function navigateLightbox(dir) {
  if (lightboxPhotos.length < 2) return;
  lightboxIndex = (lightboxIndex + dir + lightboxPhotos.length) % lightboxPhotos.length;
  renderLightbox();
}

function renderLightbox() {
  document.getElementById('lightbox-media').innerHTML =
    `<img src="${lightboxPhotos[lightboxIndex]}" alt="Trail photo">`;
  document.getElementById('lightbox-counter').textContent =
    lightboxPhotos.length > 1 ? `${lightboxIndex + 1} / ${lightboxPhotos.length}` : '';
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowRight') navigateLightbox(1);
  if (e.key === 'ArrowLeft')  navigateLightbox(-1);
  if (e.key === 'Escape')     closeLightbox();
});

// Swipe navigation for touch devices. Vertical drags are left alone (so a
// downward swipe can still scroll/dismiss) — only a mostly-horizontal drag
// past the threshold counts as a page turn.
(function () {
  const SWIPE_THRESHOLD_PX = 40;
  const inner = document.getElementById('lightbox-inner');
  let startX = null;
  let startY = null;

  inner.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  inner.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null;
    if (Math.abs(dx) > SWIPE_THRESHOLD_PX && Math.abs(dx) > Math.abs(dy)) {
      navigateLightbox(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  const container = document.getElementById('activities-container');
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('No data yet');
    const activities = await res.json();

    if (!activities.length) {
      container.innerHTML = `
        <div class="empty-state">
          <p>No activities yet — check back once the hike starts on April 28!</p>
        </div>`;
      return;
    }

    container.innerHTML = '';
    activities.forEach(a => container.appendChild(renderActivity(a)));
    if (window.initComments) window.initComments();

  } catch (e) {
    container.innerHTML = `
      <div class="empty-state">
        <p>Activities will appear here once the hike begins and Strava syncs.</p>
        <p style="font-size:0.8rem;margin-top:0.5rem;font-family:var(--sans)">Check back after April 28, 2026</p>
      </div>`;
  }
}

init();
</script>

<script>
function toggleNav() {
  var btn  = document.getElementById("nav-hamburger");
  var menu = document.getElementById("nav-mobile-menu");
  btn.classList.toggle("open");
  menu.classList.toggle("open");
}
document.addEventListener("click", function(e) {
  var btn  = document.getElementById("nav-hamburger");
  var menu = document.getElementById("nav-mobile-menu");
  if (menu && menu.classList.contains("open") && !menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
    btn.classList.remove("open");
    menu.classList.remove("open");
  }
});
</script>
